# Voila by Vivi – Supabase ébresztő
# Kétnaponta "rákopog" a Supabase-re, hogy az ingyenes projekt ne aludjon el
# (a Supabase 1 hét csend után szünetelteti), és közben az ütemezést is
# életben tartja (a GitHub 60 nap tétlenség után leállítaná).
# A Supabase címét és nyilvános kulcsát a beallitasok.js-ből olvassa.
name: Supabase ébresztő

on:
  schedule:
    - cron: "17 6 */2 * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Életjel a Supabase-nek
        run: |
          node -e '
            global.window = {};
            require("./beallitasok.js");
            const c = window.VV_SUPABASE || {};
            if (!c.url || !c.anonKey) { console.log("A Supabase még nincs beállítva (beallitasok.js) – kihagyva."); process.exit(0); }
            fetch(c.url + "/rest/v1/rpc/ping", { method: "POST", headers: { apikey: c.anonKey, "Content-Type": "application/json" }, body: "{}" })
              .then(async r => { console.log("Supabase válasz:", r.status, await r.text()); if (!r.ok) process.exit(1); })
              .catch(e => { console.error(e); process.exit(1); });
          '

      - name: Ütemezés életben tartása
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/ebreszto.yml/enable"
